name: Standard-library components

# The Excel adapter and the Power BI application have no pyproject.toml and no
# Python dependencies, so they are not uv workspace members and cannot run
# through ci-package.yml. Each gets the same lint tools at the same pins
# (configured in its own ruff.toml and mypy.ini) and its standard-library suite
# runs on the same Python matrix. The Power BI report also runs Microsoft's
# PBIR validator once.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify path selection
        run: python -m unittest tests.test_ci_paths -v
      - name: Select affected checks
        id: select
        env:
          # Only a pull request filters by path. A push to main leaves CI_BASE
          # empty so select_paths.py runs every check: release-policy reads the
          # push run of the exact main commit and a skipped check is not evidence.
          CI_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          CI_HEAD: ${{ github.sha }}
          CI_PATHS: |
            adapters/accounting-excel-toolkit/**
            apps/australian-accounting-power-bi/**
            contracts/xero-trial-balance-v1/**
            .github/**
            AGENTS.md
            CONTRIBUTING.md
            IMPORTS.md
            README.md
            SECURITY.md
            pyproject.toml
            uv.lock
            justfile
        run: python .github/ci/select_paths.py >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - adapters/accounting-excel-toolkit
          - apps/australian-accounting-power-bi
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pinned lint tools
        run: python -m pip install --disable-pip-version-check "ruff==0.16.6" "mypy==2.3.1"

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy

  verify:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - adapters/accounting-excel-toolkit
          - apps/australian-accounting-power-bi
        python: ["3.10", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run the component's standard-library suite
        run: python -B -m unittest discover -s tests -v

      # The PBIR structural validation does not depend on the Python version,
      # so it runs once, on the leg that matches the lint job.
      - name: Set up Node.js
        if: matrix.component == 'apps/australian-accounting-power-bi' && matrix.python == '3.12'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install the pinned PBIR validator
        if: matrix.component == 'apps/australian-accounting-power-bi' && matrix.python == '3.12'
        run: npm ci --ignore-scripts

      - name: Validate the report with Microsoft's PBIR authoring CLI
        if: matrix.component == 'apps/australian-accounting-power-bi' && matrix.python == '3.12'
        run: >-
          npx --no-install powerbi-report-author
          validate australian-accounting-power-bi.Report

  standard-library-gates:
    needs: [changes, lint, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Require the selected checks to complete
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json, os
          results = json.loads(os.environ["RESULTS"])
          changes = results.pop("changes")
          selected = changes.get("outputs", {}).get("run")
          if changes["result"] != "success" or selected not in {"true", "false"}:
              raise SystemExit("Change selection did not complete")
          expected = "success" if selected == "true" else "skipped"
          failed = [name for name, value in results.items() if value["result"] != expected]
          if failed:
              raise SystemExit("Checks did not complete as expected: " + ", ".join(failed))
