name: Standard-library components

# The Excel adapter, the Power BI application and the grant workpapers
# application have no Python dependencies and are not uv workspace members, so
# they cannot run through ci-package.yml. The grant application keeps a
# pyproject.toml for its setup and replay utility and is never released. Each
# gets the same lint tools at the same pins (configured in its own ruff and mypy
# settings) and its standard-library suite runs on the same Python matrix. The
# grant workpaper itself is a Rust binary from 0.2.0; the rust job checks it on
# Linux and Windows, whose exclusive-rename publication differs. The grant
# application's Python suite also runs on Windows. The Power BI application's
# fixture generator, review workflow and structural checks are Rust. Its frozen
# Python oracle runs only in the native differential job. The report also runs
# Microsoft's PBIR validator once.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify path selection
        run: python -m unittest tests.test_ci_paths -v
      - name: Select affected checks
        id: select
        env:
          # Only a pull request filters by path. A push to main leaves CI_BASE
          # empty so select_paths.py runs every check: release-policy reads the
          # push run of the exact main commit and a skipped check is not evidence.
          CI_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          CI_HEAD: ${{ github.sha }}
          CI_PATHS: |
            adapters/accounting-excel-toolkit/**
            apps/australian-accounting-power-bi/**
            apps/grant-acquittal-workpapers/**
            contracts/xero-trial-balance-v1/**
            .github/**
            AGENTS.md
            CONTRIBUTING.md
            IMPORTS.md
            README.md
            SECURITY.md
            pyproject.toml
            uv.lock
            justfile
        run: python .github/ci/select_paths.py >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - adapters/accounting-excel-toolkit
          - apps/grant-acquittal-workpapers
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true

      # .github/requirements-lint.in names the pins; regenerate the hashed file
      # with uv pip compile (command in its header) when they change.
      - name: Install pinned lint tools
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary :all: --requirement "$GITHUB_WORKSPACE/.github/requirements-lint.txt"

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy

  verify:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - adapters/accounting-excel-toolkit
          - apps/grant-acquittal-workpapers
        python: ["3.14", "3.15"]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Run the component's standard-library suite
        run: python -B -m unittest discover -s tests -v

  pbir:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/australian-accounting-power-bi
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        if: matrix.component == 'apps/australian-accounting-power-bi' && matrix.python == '3.14'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install the pinned PBIR validator
        run: npm ci --ignore-scripts

      - name: Validate the report with Microsoft's PBIR authoring CLI
        run: >-
          npx --no-install powerbi-report-author
          validate australian-accounting-power-bi.Report

  verify-windows:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    timeout-minutes: 15
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - apps/grant-acquittal-workpapers
        python: ["3.14", "3.15"]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Run the component's standard-library suite
        run: python -B -m unittest discover -s tests -v

  rust:
    # rust-toolchain.toml in each component directory pins the toolchain,
    # which rustup installs on first use.
    name: ${{ matrix.component }} / rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        component:
          - adapters/accounting-excel-toolkit
          - apps/australian-accounting-power-bi
          - apps/grant-acquittal-workpapers
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.component }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-features
      - name: Check the tracked VBA source
        if: matrix.component == 'adapters/accounting-excel-toolkit'
        run: cargo run --locked --release --bin check-vba-encoding
      - name: Check out the frozen Python VBA guard
        if: matrix.component == 'adapters/accounting-excel-toolkit'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e06647062efaf4410f7d4a414a0559ca51147267
          path: .encoding-oracle
          persist-credentials: false
      - name: Set up CPython for the frozen VBA guard
        if: matrix.component == 'adapters/accounting-excel-toolkit'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: Compare byte diagnostics and CLI streams with the frozen guard
        if: matrix.component == 'adapters/accounting-excel-toolkit'
        run: |
          cargo build --locked --bins --examples
          oracle_python="$(python -c 'import sys; print(sys.executable)')"
          suffix=
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          target/debug/examples/encoding-differential "$oracle_python" "$GITHUB_WORKSPACE/.encoding-oracle/adapters/accounting-excel-toolkit/tools/check_vba_encoding.py" "target/debug/check-vba-encoding$suffix" 16
          target/debug/examples/encoding-differential "$oracle_python" "$GITHUB_WORKSPACE/.encoding-oracle/adapters/accounting-excel-toolkit/tools/check_vba_encoding.py" "target/debug/check-vba-encoding$suffix" 17
      - name: Check out the frozen pre-port Power BI workflow
        if: matrix.component == 'apps/australian-accounting-power-bi'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d48b9fe681f3a3ae278a90c43cfdce9b863589d4
          path: .workflow-oracle
          persist-credentials: false
      - name: Set up CPython for the frozen workflow oracle
        if: matrix.component == 'apps/australian-accounting-power-bi'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: Build the workflow and independent native producers
        if: matrix.component == 'apps/australian-accounting-power-bi'
        run: |
          cargo build --locked --all-features --bins
          cargo build --locked --release --manifest-path ../../packages/review-ready-gate/Cargo.toml --bin review-ready
          cargo build --locked --release --manifest-path ../../packages/monthly-close-control-plane/Cargo.toml --bin close-control
          suffix=
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          mkdir "$RUNNER_TEMP/pbi-producers"
          cp "../../packages/review-ready-gate/target/release/review-ready$suffix" "$RUNNER_TEMP/pbi-producers/"
          cp "../../packages/monthly-close-control-plane/target/release/close-control$suffix" "$RUNNER_TEMP/pbi-producers/"
      - name: Compare the workflow with its frozen Python implementation
        if: matrix.component == 'apps/australian-accounting-power-bi'
        run: |
          oracle_python="$(python -c 'import sys; print(sys.executable)')"
          target/debug/workflow-differential --python "$oracle_python" --oracle "$GITHUB_WORKSPACE/.workflow-oracle/apps/australian-accounting-power-bi" --bin-dir "$RUNNER_TEMP/pbi-producers" --seed 16
          target/debug/workflow-differential --python "$oracle_python" --oracle "$GITHUB_WORKSPACE/.workflow-oracle/apps/australian-accounting-power-bi" --bin-dir "$RUNNER_TEMP/pbi-producers" --seed 17
      - name: Regenerate the fixtures and require the committed bytes
        if: matrix.component == 'apps/australian-accounting-power-bi'
        run: |
          cargo run --locked --release --bin generate-fixtures
          git diff --exit-code -- samples
      - name: Run the bundled example from the release build
        if: matrix.component == 'apps/grant-acquittal-workpapers'
        run: |
          cargo build --locked --release
          status=0
          target/release/grant-workpaper --input examples/two-grants --output "$RUNNER_TEMP/grant-example" || status=$?
          # The fabricated example retains review items, which exit 2.
          test "$status" -eq 2
          test -f "$RUNNER_TEMP/grant-example/workpaper.json"

  standard-library-gates:
    needs: [changes, lint, verify, verify-windows, rust, pbir]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Require the selected checks to complete
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json, os
          results = json.loads(os.environ["RESULTS"])
          changes = results.pop("changes")
          selected = changes.get("outputs", {}).get("run")
          if changes["result"] != "success" or selected not in {"true", "false"}:
              raise SystemExit("Change selection did not complete")
          expected = "success" if selected == "true" else "skipped"
          failed = [name for name, value in results.items() if value["result"] != expected]
          if failed:
              raise SystemExit("Checks did not complete as expected: " + ", ".join(failed))
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require every job to be listed and kept
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/standard-library-components.yml standard-library-gates --no-results
