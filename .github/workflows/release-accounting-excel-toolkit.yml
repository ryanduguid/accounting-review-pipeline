name: Release accounting-excel-toolkit

# One namespaced tag releases exactly one component. The reusable workflow
# refuses the release unless the directory leaf, the tag prefix and the
# artifact stem agree (accounting-excel-toolkit).
on:
  push:
    tags:
      - "accounting-excel-toolkit/v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      actions: read
      attestations: write # Record provenance and SBOM attestations for release assets.
      contents: write # Create the draft release, upload assets and publish it.
      id-token: write # Obtain the OIDC identity required to sign attestations.
    uses: ryanduguid/release-policy/.github/workflows/release-archive.yml@a601f1d8b143f92b0517f709216993660d21f480
    with:
      required-checks: |
        .github/workflows/no-ai-attribution.yml: Attribution policy / Attribution policy runner
        .github/workflows/standard-library-components.yml: lint (adapters/accounting-excel-toolkit)
        .github/workflows/standard-library-components.yml: verify (adapters/accounting-excel-toolkit, 3.11)
        .github/workflows/standard-library-components.yml: verify (adapters/accounting-excel-toolkit, 3.12)
        .github/workflows/standard-library-components.yml: verify (adapters/accounting-excel-toolkit, 3.13)
        .github/workflows/standard-library-components.yml: verify (adapters/accounting-excel-toolkit, 3.14)
        .github/workflows/joined-conformance.yml: verify
        .github/workflows/codeql.yml: Analyze Python
        .github/workflows/codeql.yml: codeql-gates
      artifact-stem: accounting-excel-toolkit
      source-directory: adapters/accounting-excel-toolkit
      tag-prefix: accounting-excel-toolkit
