name: Release elizabeth-anne-alexander

# One namespaced tag releases exactly one component. The reusable workflow
# refuses the release unless the directory leaf, the tag prefix and the
# normalised distribution name agree (elizabeth-anne-alexander). The version
# is read as data from the tracked literal in elizabeth_anne_alexander/version.py.
on:
  workflow_dispatch:
  push:
    tags:
      - "elizabeth-anne-alexander/v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' && github.ref != 'refs/tags/elizabeth-anne-alexander/v0.2.3-pypi-recovery'
    permissions:
      actions: read # Inspect and download only the exact bound release candidate.
      attestations: write # Record provenance and SBOM attestations for release assets.
      contents: write # Create the draft release, upload assets and publish it.
      id-token: write # Obtain the OIDC identity required to sign attestations.
    uses: ryanduguid/release-policy/.github/workflows/release-python.yml@87767ec809dc7f77bcd45808219adaf67841ae7b
    with:
      required-checks: |
        .github/workflows/no-ai-attribution.yml: Attribution policy / Attribution policy runner
        .github/workflows/ci.yml: packages/elizabeth-anne-alexander / build
        .github/workflows/ci.yml: packages/elizabeth-anne-alexander / dependency-audit
        .github/workflows/ci.yml: packages/elizabeth-anne-alexander / lint
        .github/workflows/ci.yml: packages/elizabeth-anne-alexander / test (3.10)
        .github/workflows/ci.yml: packages/elizabeth-anne-alexander / test (3.12)
        .github/workflows/ci.yml: packages/elizabeth-anne-alexander / test (3.13)
        .github/workflows/ci.yml: packages/elizabeth-anne-alexander / test (3.14)
        .github/workflows/joined-conformance.yml: verify
        .github/workflows/codeql.yml: Analyze Python
      source-directory: packages/elizabeth-anne-alexander
      tag-prefix: elizabeth-anne-alexander
      upload-dist-artifact: true
      version-parser: python-literal
      version-file: elizabeth_anne_alexander/version.py

  pypi:
    timeout-minutes: 15
    name: publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi-elizabeth-anne-alexander
      url: https://pypi.org/p/elizabeth-anne-alexander
    permissions:
      actions: read # Inspect the exact artefact.
      attestations: read # Read the package attestations.
      contents: read # Read the pinned policy.
      id-token: write # Mint the OIDC token PyPI Trusted Publishing verifies.
    steps:
      - name: Check out the policy that built the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryanduguid/release-policy
          ref: ${{ needs.release.outputs.policy-sha }}
          path: policy
          persist-credentials: false

      - name: Verify artefact identity
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_ID: ${{ needs.release.outputs.dist-id }}
          DIST_DIGEST: ${{ needs.release.outputs.dist-digest }}
          STEM: ${{ needs.release.outputs.stem }}
          VERSION: ${{ needs.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIST_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DIST_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$DIST_ID" > artifact.json
          jq -e --argjson id "$DIST_ID" --arg digest "sha256:$DIST_DIGEST" \
            --arg name "dist-$STEM-$VERSION" --argjson run "$GITHUB_RUN_ID" \
            --arg sha "$GITHUB_SHA" \
            '.id == $id and .digest == $digest and .name == $name
             and .expired == false and .workflow_run.id == $run
             and .workflow_run.head_sha == $sha' artifact.json >/dev/null

      - name: Download the bound distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.release.outputs.dist-id }}
          path: candidate

      - name: Verify candidate bytes and publication attestations
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ needs.release.outputs.policy-sha }}
          STEM: ${{ needs.release.outputs.stem }}
          VERSION: ${{ needs.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python policy/scripts/python_release.py verify-candidate \
            --directory candidate --stem "$STEM" --version "$VERSION" \
            --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" --policy-sha "$POLICY_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          mkdir dist
          for file in "candidate/$STEM-$VERSION-py3-none-any.whl" "candidate/$STEM-$VERSION.tar.gz"; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
              --signer-workflow ryanduguid/release-policy/.github/workflows/release-python.yml \
              --signer-digest "$POLICY_SHA"
            cp "$file" dist/
          done

      - name: Publish to PyPI via trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  recover-pypi-0-2-3:
    name: Publish the verified 0.2.3 release to PyPI
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/tags/elizabeth-anne-alexander/v0.2.3-pypi-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi-elizabeth-anne-alexander
      url: https://pypi.org/p/elizabeth-anne-alexander
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - name: Verify the existing immutable release and its attested assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo=ryanduguid/accounting-review-pipeline
          tag=elizabeth-anne-alexander/v0.2.3
          commit=874e92d85458e87ebf726b1fc35ca3c333c88934
          policy=fcf25e532e9eb60056ae6e5c819cf3125c4f4b91
          test "$GITHUB_REPOSITORY" = "$repo"
          gh api "repos/$repo/releases/tags/$tag" \
            | jq -e --arg tag "$tag" '.immutable == true and .draft == false and .prerelease == false and .tag_name == $tag and (.assets | length) == 5'
          gh release verify "$tag" --repo "$repo"
          mkdir proof dist
          assets=(elizabeth_anne_alexander-0.2.3-py3-none-any.whl
                  elizabeth_anne_alexander-0.2.3.tar.gz
                  elizabeth_anne_alexander-0.2.3.spdx.json
                  release-manifest.json SHA256SUMS)
          for asset in "${assets[@]}"; do
            gh release download "$tag" --repo "$repo" --pattern "$asset" --dir proof
            gh release verify-asset "$tag" "proof/$asset" --repo "$repo"
            gh attestation verify "proof/$asset" --repo "$repo" \
              --source-digest "$commit" --source-ref "refs/tags/$tag" \
              --signer-workflow ryanduguid/release-policy/.github/workflows/release-python.yml \
              --signer-digest "$policy"
          done
          (cd proof && sha256sum --check SHA256SUMS)
          gh attestation verify proof/elizabeth_anne_alexander-0.2.3-py3-none-any.whl \
            --repo "$repo" --source-digest "$commit" --source-ref "refs/tags/$tag" \
            --signer-workflow ryanduguid/release-policy/.github/workflows/release-python.yml \
            --signer-digest "$policy" --predicate-type https://spdx.dev/Document/v2.3
          cp proof/elizabeth_anne_alexander-0.2.3-py3-none-any.whl dist/
          cp proof/elizabeth_anne_alexander-0.2.3.tar.gz dist/

      - name: Publish the original wheel and source distribution via trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
