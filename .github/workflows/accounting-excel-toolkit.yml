name: Accounting Excel Toolkit

# The Excel adapter has no pyproject.toml and no Python dependencies, so it is
# not a uv workspace member and cannot run through ci-package.yml. It gets the
# same lint tools at the same pins (configured in its ruff.toml and mypy.ini)
# and its standard-library suite runs on the same Python matrix.

on:
  push:
    branches: [main]
    paths:
      - "adapters/accounting-excel-toolkit/**"
      - "contracts/xero-trial-balance-v1/**"
      - ".github/**"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "IMPORTS.md"
      - "README.md"
      - "SECURITY.md"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"
  pull_request:
    paths:
      - "adapters/accounting-excel-toolkit/**"
      - "contracts/xero-trial-balance-v1/**"
      - ".github/**"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "IMPORTS.md"
      - "README.md"
      - "SECURITY.md"
      - "pyproject.toml"
      - "uv.lock"
      - "justfile"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/accounting-excel-toolkit
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned lint tools
        run: python -m pip install --disable-pip-version-check "ruff==0.16.6" "mypy==2.3.1"

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy

  verify:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        working-directory: adapters/accounting-excel-toolkit
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run source-safety regression checks
        run: python -B -m unittest discover -s tests -v
