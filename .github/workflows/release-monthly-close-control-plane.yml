name: monthly-close-control-plane release blocked

on:
  push:
    tags: ['monthly-close-control-plane/v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-blocked:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse publication until the native release policy is configured
        run: |
          echo "::error::monthly-close-control-plane is a Rust binary. Native release publishing is not configured. Do not tag or publish."
          exit 1
