name: Joined accounting examples

# Runs every joined route against the latest main of au-fpa-pack and
# australian-accounting, so a companion change that breaks a route shows up the
# next day. Pull requests and pushes run joined-fixtures.yml, which pins the
# companions instead. Not a required check: a red run here is the signal.

on:
  schedule:
    - cron: '23 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Joined examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Set up and verify all joined examples
        shell: bash
        run: python apps/grant-acquittal-workpapers/setup_utility.py --workspace "${{ runner.temp }}/accounting-utility" --summary "$GITHUB_STEP_SUMMARY"
      - name: Retain fabricated results and failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accounting-utility-${{ matrix.os }}
          path: ${{ runner.temp }}/accounting-utility/results/
          if-no-files-found: warn
          retention-days: 7
