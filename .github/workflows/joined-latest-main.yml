name: Joined accounting examples

# Runs every joined route against the latest main of au-fpa-pack and
# australian-accounting, so a companion change that breaks a route shows up the
# next day. Pull requests and pushes run joined-fixtures.yml, which pins the
# companions instead. Not a required check: a red run here is the signal.

on:
  schedule:
    - cron: '23 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Joined examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.0'
          enable-cache: false
      - name: Set up and verify all joined examples
        shell: bash
        run: python apps/grant-acquittal-workpapers/setup_utility.py --workspace "${{ runner.temp }}/accounting-utility" --summary "$GITHUB_STEP_SUMMARY"
      - name: Retain fabricated results and failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accounting-utility-${{ matrix.os }}
          path: ${{ runner.temp }}/accounting-utility/results/
          if-no-files-found: warn
          retention-days: 7
