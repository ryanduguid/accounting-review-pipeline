name: Xero Trial Balance Export

on:
  push:
    branches: [main]
    paths:
      - "packages/xero-trial-balance-export/**"
      - "contracts/xero-trial-balance-v1/**"
      - ".github/**"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "IMPORTS.md"
      - "README.md"
      - "SECURITY.md"
  pull_request:
    paths:
      - "packages/xero-trial-balance-export/**"
      - "contracts/xero-trial-balance-v1/**"
      - ".github/**"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "IMPORTS.md"
      - "README.md"
      - "SECURITY.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/xero-trial-balance-export
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Install linters
        run: python -m pip install "ruff>=0.11" "mypy>=1.14"
      - name: Ruff
        run: python -m ruff check xero_client.py export_tb.py auth.py token_store.py
      - name: Typecheck
        run: python -m mypy --ignore-missing-imports --pretty xero_client.py export_tb.py auth.py token_store.py
