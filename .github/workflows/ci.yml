name: tests

# The `test`, `package` and `lint` jobs are Monthly Close Controls' own checks,
# which its release workflow selects by name, so they keep their ids. This
# workflow carries no path filter, so `pipeline-gates`, the check branch
# protection requires, reports on every pull request. They run the same gates as ci-package.yml: `test` measures branch
# coverage and `dependency-audit` runs pip-audit against the locked
# environment. The `component` matrix calls the reusable ci-package.yml once per
# other Python distribution; on a pull request each call filters itself to its
# component directory, the shared contract and the root files, so a change to
# one component runs that component alone, and a push to main runs every
# component so the release gate finds its checks. The `windows` job runs Monthly
# Close Controls with coverage; `windows-workspace` checks the full suite
# from the root on Windows. The Excel adapter and the Power BI
# application have no pyproject.toml and are not workspace members; their
# standard-library suites run in standard-library-components.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI follows Python 3.15 maintenance releases; local development pins the patch.
env:
  UV_PYTHON: "3.15"

jobs:
  component:
    name: ${{ matrix.package_dir }}
    strategy:
      fail-fast: false
      matrix:
        # Each component's wheel smoke lives in .github/ci/<component>/smoke.sh;
        # ci-package.yml runs it from an empty directory with the installed
        # wheel's console scripts on PATH and COMPONENT pointing at the
        # checked-out component, so each proves the wheel carries its package
        # data and the documented exit codes hold. The exporter has no offline
        # command line to exercise; its hash-locked install and unittest run
        # cover it.
        include:
          - package_dir: packages/review-ready-gate
            import_name: reviewready
    permissions:
      contents: read
      id-token: write # ci-package.yml's codecov job authenticates its upload with OIDC.
    uses: ./.github/workflows/ci-package.yml
    with:
      package_dir: ${{ matrix.package_dir }}
      import_name: ${{ matrix.import_name }}

  test:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install the locked toolchain
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      # No -q here: the component's pytest addopts already sets it, and a second
      # one is -qq, which drops the "N passed" count from the log. --cov takes
      # its source from the component's [tool.coverage.run] configuration, the
      # same gate ci-package.yml runs for the other components.
      - name: run tests with branch coverage
        run: uv run --locked --extra dev pytest --cov --cov-branch --cov-report=term-missing --cov-report=xml  # NOSONAR: uv builds only this workspace's packages; dependencies install from wheels
        working-directory: packages/monthly-close-control-plane
        env:
          UV_PYTHON: ${{ matrix.python }}
      - name: keep the coverage report for the Codecov upload
        if: matrix.python == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-codecov
          path: packages/monthly-close-control-plane/coverage.xml
          retention-days: 1

  dependency-audit:
    permissions:
      contents: read
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Install the locked toolchain
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: audit the locked project environment
        run: uv run --locked --extra dev --with "pip-audit==2.10.1" pip-audit --local --strict  # NOSONAR: uv builds only this workspace's packages; dependencies install from wheels
        working-directory: packages/monthly-close-control-plane

  package:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Install the locked toolchain
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - run: uv run --locked --extra dev --python 3.14 python -m build  # NOSONAR: uv builds only this workspace's packages; dependencies install from wheels
        working-directory: packages/monthly-close-control-plane
      - name: Install and smoke-test the built wheel outside the checkout
        working-directory: packages/monthly-close-control-plane
        run: |
          python -m venv /tmp/venv
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          /tmp/venv/bin/pip install --no-index dist/*.whl
          cd /tmp
          /tmp/venv/bin/python -I \
            "$GITHUB_WORKSPACE/packages/monthly-close-control-plane/tests/smoke_installed_wheel.py" \
            "$GITHUB_WORKSPACE/packages/monthly-close-control-plane"

  lint:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - run: uv run --locked --extra dev ruff check closecontrol tests  # NOSONAR: uv builds only this workspace's packages; dependencies install from wheels
        working-directory: packages/monthly-close-control-plane
      - run: uv run --locked --extra dev mypy closecontrol  # NOSONAR: uv builds only this workspace's packages; dependencies install from wheels
        working-directory: packages/monthly-close-control-plane

  windows:
    # Monthly Close Controls' documented Windows wheel smoke follows this suite.
    # The native exporter and ledger gateway have Windows legs in the Rust job.
    # A Windows leg inside ci-package.yml would rename every `test (3.x)` job
    # the release callers require by name, so this is one extra job instead. It
    # runs the same command as the Linux gates, from the component directory.
    name: windows (${{ matrix.package_dir }})
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: windows-latest
    env:
      UV_PYTHON: "3.15"
    strategy:
      fail-fast: false
      matrix:
        package_dir:
          - packages/monthly-close-control-plane
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: run tests with branch coverage
        run: uv run --locked --extra dev pytest --cov --cov-branch --cov-report=term-missing --cov-report=xml
        working-directory: ${{ matrix.package_dir }}

  rust:
    # The ledger gate, evatt and exporter are Rust crates from 1.0.0.
    # Each rust-toolchain.toml pins the toolchain. Windows also exercises staged
    # validation writes and evatt's record links, native paths and text streams.
    name: ${{ matrix.package_dir }} / rust (${{ matrix.os }})
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        package_dir: [packages/elizabeth-anne-alexander, packages/evatt, packages/xero-trial-balance-export]
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.package_dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: format
        run: cargo fmt --check
      - name: lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --locked --all-features
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.package_dir == 'packages/xero-trial-balance-export'
        with:
          python-version: '3.15'
      - name: Compare the exporter with the pinned Python baseline
        if: matrix.package_dir == 'packages/xero-trial-balance-export'
        run: |
          baseline="$RUNNER_TEMP/xero-python-baseline"
          oracle="$RUNNER_TEMP/xero-python-oracle"
          mkdir -p "$baseline"
          git archive 1af8a855578afaec97bd2e56836a8aa8fb15e729:packages/xero-trial-balance-export | tar -xf - -C "$baseline"
          python -m venv "$oracle"
          oracle_python="$oracle/bin/python"
          [ ! -f "$oracle/Scripts/python.exe" ] || oracle_python="$oracle/Scripts/python.exe"
          "$oracle_python" -m pip install --only-binary :all: --require-hashes -r tests/differential/requirements.lock
          cargo build --locked --features probe
          extension=""
          [ ! -f target/debug/xero-tb-probe.exe ] || extension=".exe"
          "target/debug/xero-tb-differential$extension" "$oracle_python" "$baseline" "target/debug/xero-tb-probe$extension" 1 10000
      - name: build
        run: cargo build --locked --release
      - name: smoke the release binary from an empty directory
        run: |
          binary="$PWD/target/release"
          component="${PWD##*/}"
          smoke="$PWD/../../.github/ci/$component/smoke.sh"
          export COMPONENT="$PWD"
          work="$(mktemp -d)"
          cd "$work"
          PATH="$binary:$PATH" bash "$smoke"

  windows-workspace:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: windows-latest
    env:
      UV_PYTHON: "3.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: check the workspace and standalone component locks
        shell: python
        run: |
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile

          subprocess.run(["uv", "lock", "--check"], check=True)
          for component in sorted(Path("packages").iterdir()):
              if not (component / "pyproject.toml").is_file():
                  continue
              subprocess.run(["uv", "lock", "--check"], cwd=component, check=True)
              # Inside a workspace member, uv checks the root lock. Check each
              # standalone lock outside the workspace as ci-package.yml does.
              with tempfile.TemporaryDirectory() as standalone:
                  for name in ("pyproject.toml", "uv.lock"):
                      shutil.copyfile(component / name, Path(standalone) / name)
                  subprocess.run(["uv", "lock", "--check"], cwd=standalone, check=True)
      - name: lint the workspace
        run: uv run --locked --group dev ruff check .  # NOSONAR: uv builds only this workspace's packages; dependencies install from wheels
      - name: type-check the workspace
        run: uv run --locked --group dev mypy  # NOSONAR: uv builds only this workspace's packages; dependencies install from wheels
      - name: run the full suite
        run: uv run --locked --group dev pytest  # NOSONAR: uv builds only this workspace's packages; dependencies install from wheels

  # The upload runs apart from the tests so the OIDC token is never available
  # while test code runs. It is exempt from pipeline-gates: a Codecov outage must not
  # block merges.
  codecov:
    name: upload coverage to Codecov
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-codecov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true
          flags: monthly-close-control-plane

  pipeline-gates:
    needs: [component, test, dependency-audit, package, lint, windows, rust, windows-workspace]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Require the selected checks to complete
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          import json, os
          results = json.loads(os.environ["RESULTS"])
          expected = "success"
          failed = [name for name, value in results.items() if value["result"] != expected]
          if failed:
              raise SystemExit("Checks did not complete as expected: " + ", ".join(failed))
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require every job to be listed and kept
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/ci.yml pipeline-gates --no-results --exempt codecov
