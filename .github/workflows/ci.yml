name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the locked toolchain
        run: python -m pip install "uv==0.12.0"
      - run: uv run --locked --extra dev pytest -q
        env:
          UV_PYTHON: ${{ matrix.python }}

  package:
    timeout-minutes: 15
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the locked toolchain
        run: python -m pip install "uv==0.12.0"
      - run: uv run --locked --extra dev --python 3.12 python -m build
      - name: Install and smoke-test the built wheel outside the checkout
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --no-index --find-links dist monthly-close-control-plane
          cd /tmp
          /tmp/venv/bin/close-control review \
            --current "$GITHUB_WORKSPACE/examples/current_trial_balance.csv" \
            --prior "$GITHUB_WORKSPACE/examples/prior_trial_balance.csv" \
            --output pack || [ $? -eq 2 ]
          test -f pack/close-review-pack.json
