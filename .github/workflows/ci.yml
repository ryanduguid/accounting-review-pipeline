          collector.get_data().touch_files(sorted(owned))
          collector.save()
          name = "coverage-python-" + os.environ["RUNNER_OS"]
          collector.json_report(outfile=name + ".json")
          collector.xml_report(outfile=name + ".xml")
          report = json.loads(Path(name + ".json").read_text(encoding="utf-8"))
          if set(report["files"]) != owned:
              raise SystemExit("Python coverage inventory differs from the maintained sources")
          if report["totals"]["excluded_lines"]:
              raise SystemExit("Python coverage must retain every executable statement")
          print(json.dumps(report["totals"], sort_keys=True))
          PY
      - name: retain Python coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python-${{ runner.os }}
