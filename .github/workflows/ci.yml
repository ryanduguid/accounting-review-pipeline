name: tests

# The `test`, `package` and `lint` jobs are Monthly Close Controls' own checks
# and the anchor required checks on main (`package`, `test (3.10)` to
# `test (3.13)`), so they keep their ids and this workflow carries no path
# filter. They run the same gates as ci-package.yml: `test` measures branch
# coverage and `dependency-audit` runs pip-audit against the locked
# environment. The `component` matrix calls the reusable ci-package.yml once per
# other Python distribution; each call filters itself to its component
# directory, the shared contract and the root files, so a change to one
# component runs that component alone. The Excel adapter and the Power BI
# application have no pyproject.toml and are not workspace members; their
# standard-library suites run in standard-library-components.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component:
    name: ${{ matrix.package_dir }}
    strategy:
      fail-fast: false
      matrix:
        # Each component's wheel smoke lives in .github/ci/<component>/smoke.sh;
        # ci-package.yml runs it from an empty directory with the installed
        # wheel's console scripts on PATH and COMPONENT pointing at the
        # checked-out component, so each proves the wheel carries its package
        # data and the documented exit codes hold. The exporter has no offline
        # command line to exercise; its hash-locked install and unittest run
        # cover it.
        include:
          - package_dir: packages/review-ready-gate
            import_name: reviewready
          - package_dir: packages/elizabeth-anne-alexander
            import_name: elizabeth_anne_alexander
          - package_dir: packages/xero-trial-balance-export
            import_name: xero_client
          - package_dir: packages/evatt
            import_name: evatt
    permissions:
      contents: read
    uses: ./.github/workflows/ci-package.yml
    with:
      package_dir: ${{ matrix.package_dir }}
      import_name: ${{ matrix.import_name }}

  test:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the locked toolchain
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
      # No -q here: the component's pytest addopts already sets it, and a second
      # one is -qq, which drops the "N passed" count from the log. --cov takes
      # its source from the component's [tool.coverage.run] configuration, the
      # same gate ci-package.yml runs for the other components.
      - name: run tests with branch coverage
        run: uv run --locked --extra dev pytest --cov --cov-branch --cov-report=term-missing --cov-report=xml
        working-directory: packages/monthly-close-control-plane
        env:
          UV_PYTHON: ${{ matrix.python }}

  dependency-audit:
    permissions:
      contents: read
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the locked toolchain
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
      - name: audit the locked project environment
        run: uv run --locked --extra dev --with "pip-audit==2.10.1" pip-audit --local --strict
        working-directory: packages/monthly-close-control-plane

  package:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the locked toolchain
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv run --locked --extra dev --python 3.12 python -m build
        working-directory: packages/monthly-close-control-plane
      - name: Install and smoke-test the built wheel outside the checkout
        working-directory: packages/monthly-close-control-plane
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --no-index --find-links dist monthly-close-control-plane
          cd /tmp
          /tmp/venv/bin/close-control review \
            --current "$GITHUB_WORKSPACE/packages/monthly-close-control-plane/examples/current_trial_balance.csv" \
            --prior "$GITHUB_WORKSPACE/packages/monthly-close-control-plane/examples/prior_trial_balance.csv" \
            --output pack || [ $? -eq 2 ]
          test -f pack/close-review-pack.json

  lint:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv run --locked --extra dev ruff check closecontrol tests
        working-directory: packages/monthly-close-control-plane
      - run: uv run --locked --extra dev mypy closecontrol
        working-directory: packages/monthly-close-control-plane
