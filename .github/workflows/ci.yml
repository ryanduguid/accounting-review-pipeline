                     "packages/monthly-close-control-plane/examples/utility_workflows.py",
                     "adapters/accounting-excel-toolkit/tools/benchmark_aged_review.py",
                     "apps/grant-acquittal-workpapers/tools/gen_unicode_tables.py",
                     "packages/elizabeth-anne-alexander/tools/gen_unicode_tables.py",
                     "packages/evatt/tools/gen_unicode_tables.py",
                     "packages/evatt/tools/gen_patterns.py",
                     "packages/evatt/tools/gen_unicode_cases.py",
                     "packages/evatt/tools/record_python_tests.py",)
          tracked = subprocess.check_output(["git", "ls-files", "--", "*.py"], text=True).splitlines()
          maintained = {name for name in tracked if "tests" not in Path(name).parts}
          if set(sources) != maintained:
              raise SystemExit("Maintained Python source inventory changed; update coverage inputs")
          if not all((root / name).is_file() for name in sources):
              raise SystemExit("A maintained Python source is missing")
          config = output / "coverage.ini"
          config.write_text("[run]\nparallel = true\nrelative_files = true\npatch = subprocess\ninclude =\n"
                            + "".join("    " + str(root / name) + "\n" for name in sources), encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"COVERAGE_RCFILE={config}\nCOVERAGE_FILE={output / '.coverage'}\n")
      - name: run the full suite
        run: uv run --locked --group dev coverage run -m pytest
      - name: retain every maintained Python source in the report
        shell: bash
        run: |
          uv run --locked --group dev coverage combine --keep "$RUNNER_TEMP/python-coverage"
          uv run --locked --group dev python - <<'PY'
