  pipeline-gates:
    needs: [dependency-audit, rust, python-coverage, windows-workspace, upload-coverage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Require the selected checks to complete
        shell: python
        env:
          RESULTS: ${{ toJSON(needs) }}
          COVERAGE_REQUIRED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          import json, os
          results = json.loads(os.environ["RESULTS"])
          expected = "success"
          failed = [name for name, value in results.items() if value["result"] != expected
                    and not (name == "upload-coverage" and value["result"] == "skipped"
                             and os.environ["COVERAGE_REQUIRED"] == "false")]
          if failed:
              raise SystemExit("Checks did not complete as expected: " + ", ".join(failed))
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require every job to be listed and kept
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/ci.yml pipeline-gates --no-results
