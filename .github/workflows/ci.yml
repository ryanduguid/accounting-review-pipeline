name: tests

# The `test`, `package` and `lint` jobs are Monthly Close Controls' own checks
# and the anchor required checks on main (`package`, `test (3.10)` to
# `test (3.13)`), so they keep their ids and this workflow carries no path
# filter. They run the same gates as ci-package.yml: `test` measures branch
# coverage and `dependency-audit` runs pip-audit against the locked
# environment. The `component` matrix calls the reusable ci-package.yml once per
# other Python distribution; each call filters itself to its component
# directory, the shared contract and the root files, so a change to one
# component runs that component alone. The Excel adapter and the Power BI
# application have no pyproject.toml and are not workspace members; their
# standard-library suites run in their own root workflows.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component:
    strategy:
      fail-fast: false
      matrix:
        # smoke runs from an empty directory with the installed wheel's console
        # scripts on PATH and COMPONENT pointing at the checked-out component,
        # so each block below proves the wheel carries its package data and the
        # documented exit codes hold. The exporter has no offline command line
        # to exercise; its hash-locked install and unittest run cover it.
        include:
          - package_dir: packages/review-ready-gate
            import_name: reviewready
            smoke: |
              review-ready gate --profile bas --pack "${COMPONENT}/examples/bas-ready" --output pack
              test -f pack/readiness-pack.json
              review-ready gate --profile bas --pack "${COMPONENT}/examples/bas-not-ready" --output pack-nr && nr=0 || nr=$?
              test "$nr" = "2"
              review-ready gate --profile bas --pack "${COMPONENT}/examples/bas-blocked" --output pack-bl && bl=0 || bl=$?
              test "$bl" = "2"
              python -c "import json; assert json.load(open('pack-bl/readiness-pack.json'))['overall_status']=='BLOCKED'"
          - package_dir: packages/elizabeth-anne-alexander
            import_name: elizabeth_anne_alexander
            smoke: |
              elizabeth-anne-alexander evaluate \
                --context samples/contexts/sample-monthly-variance.context.json \
                --request samples/requests/sample-revenue-variance.request.json \
                --policy policy/demo-policy-v1.json \
                --out build/demo
              elizabeth-anne-alexander validate-review \
                --evidence build/demo/reviewer-evidence.json \
                --receipt build/demo/receipt.json \
                --decision samples/decisions/sample-review-decision.json
              test -f build/demo/receipt.json
          - package_dir: packages/xero-trial-balance-export
            import_name: xero_client
          - package_dir: packages/evatt
            import_name: evatt
            smoke: |
              # samples/ ships as package data, so the demo inputs are read out
              # of the installed wheel rather than the checkout: a wheel that
              # drops them produces a console script whose demo cannot run.
              # Every evatt command asks git whether it would let you commit the
              # map, so the demo directory has to be a work tree with a covering
              # ignore rule.
              git init --quiet .
              printf 'entities.json\n*.triage.md\n' > .gitignore
              samples=$(python -c "import evatt, pathlib; print(pathlib.Path(evatt.__file__).parent / 'samples')")
              cp "${samples}/entities.sample.json" entities.json
              cp "${samples}/entities-only.md" in.md
              cp "${samples}/identifiers.md" identifiers.md
              cp "${samples}/unmapped-name.md" halt.md
              # A redact, verify and restore round trip, byte for byte, with a
              # manifest beside the redacted output.
              evatt redact --in in.md --map entities.json --out build/out.md
              evatt verify --in build/out.md --map entities.json
              evatt restore --in build/out.md --map entities.json --out build/back.md
              cmp in.md build/back.md
              test -f build/out.md.manifest.json
              cat build/out.md.manifest.json
              # A file that uses CRLF throughout comes back with CRLF intact.
              awk '{ printf "%s\r\n", $0 }' in.md > crlf.md
              evatt redact --in crlf.md --map entities.json --out build/crlf.md
              evatt restore --in build/crlf.md --map entities.json --out build/crlf-back.md
              cmp crlf.md build/crlf-back.md
              # verify exits 2 on a file that is not ready. Its output is
              # redirected rather than echoed, because verify prints the values
              # it found and a tax file number in a job log is the leak this
              # package exists to prevent.
              evatt verify --in identifiers.md --map entities.json > verify.log 2>&1 && vf=0 || vf=$?
              test "$vf" = "2"
              grep -q "not ready to send" verify.log
              # A halt exits 2, writes a triage file, and clears any stale output
              # already sitting at that path. The clean redact above it is what
              # puts a stale output there to be cleared.
              evatt redact --in in.md --map entities.json --out build/halt.md
              test -f build/halt.md
              evatt redact --in halt.md --map entities.json --out build/halt.md && ht=0 || ht=$?
              test "$ht" = "2"
              test ! -f build/halt.md
              test ! -f build/halt.md.manifest.json
              test -f build/halt.md.triage.md
              # --out refuses to be the map or the input, and refuses through the
              # two paths it derives as well. A map named map.triage.md is
              # covered by the same ignore rule as a triage file, and --out map
              # derives that exact path.
              before=$(cksum < entities.json)
              cp entities.json map.triage.md
              evatt redact --in in.md --map entities.json --out entities.json && mp=0 || mp=$?
              evatt redact --in in.md --map entities.json --out in.md && ip=0 || ip=$?
              evatt redact --in in.md --map map.triage.md --out map && dv=0 || dv=$?
              test "$mp" = "1"
              test "$ip" = "1"
              test "$dv" = "1"
              test "$before" = "$(cksum < entities.json)"
              # Nothing the demo produced left the map committable.
              git add -A
              test -z "$(git ls-files entities.json)"
    permissions:
      contents: read
    uses: ./.github/workflows/ci-package.yml
    with:
      package_dir: ${{ matrix.package_dir }}
      import_name: ${{ matrix.import_name }}
      smoke: ${{ matrix.smoke || '' }}

  test:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the locked toolchain
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
      # No -q here: the component's pytest addopts already sets it, and a second
      # one is -qq, which drops the "N passed" count from the log. --cov takes
      # its source from the component's [tool.coverage.run] configuration, the
      # same gate ci-package.yml runs for the other components.
      - name: run tests with branch coverage
        run: uv run --locked --extra dev pytest --cov --cov-branch --cov-report=term-missing --cov-report=xml
        working-directory: packages/monthly-close-control-plane
        env:
          UV_PYTHON: ${{ matrix.python }}

  dependency-audit:
    permissions:
      contents: read
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the locked toolchain
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
      - name: audit the locked project environment
        run: uv run --locked --extra dev --with "pip-audit==2.10.1" pip-audit --local --strict
        working-directory: packages/monthly-close-control-plane

  package:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the locked toolchain
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv run --locked --extra dev --python 3.12 python -m build
        working-directory: packages/monthly-close-control-plane
      - name: Install and smoke-test the built wheel outside the checkout
        working-directory: packages/monthly-close-control-plane
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --no-index --find-links dist monthly-close-control-plane
          cd /tmp
          /tmp/venv/bin/close-control review \
            --current "$GITHUB_WORKSPACE/packages/monthly-close-control-plane/examples/current_trial_balance.csv" \
            --prior "$GITHUB_WORKSPACE/packages/monthly-close-control-plane/examples/prior_trial_balance.csv" \
            --output pack || [ $? -eq 2 ]
          test -f pack/close-review-pack.json

  lint:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install the locked toolchain
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv run --locked --extra dev ruff check closecontrol tests
        working-directory: packages/monthly-close-control-plane
      - run: uv run --locked --extra dev mypy closecontrol
        working-directory: packages/monthly-close-control-plane
