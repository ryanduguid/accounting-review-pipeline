name: Fuzzing

# A 60-second mutation pass runs after merge, weekly and on demand. No gate
# requires it. tests/test_fuzz_harness.py replays the seed corpus on every run
# of the root suite.
on:
  push:
    branches: [main]
  schedule:
    - cron: "53 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzzing:
    name: fuzz the Monthly Close loaders
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the native mutation harness
        working-directory: packages/monthly-close-control-plane
        run: cargo build --locked --release --features tools --bin close-control-fuzz
      - name: Fuzz the loaders
        run: >-
          timeout 90s packages/monthly-close-control-plane/target/release/close-control-fuzz fuzz/corpus 60
