name: evatt

on:
  push:
    branches: [main]
    paths:
      - "packages/evatt/**"
      - ".github/**"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - "SECURITY.md"
  pull_request:
    paths:
      - "packages/evatt/**"
      - ".github/**"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - "SECURITY.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # pyproject declares requires-python >= 3.10 and mypy is configured for
    # 3.10, and until now nothing anywhere executed that floor: every job ran
    # 3.12. A declared floor no test runs is a claim, not a support statement.
    # Both legs run the whole job, the wheel demo included, because the demo is
    # what exercises the installed console script rather than the checkout.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: packages/evatt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the locked toolchain
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv lock --check
      # No -q here: pyproject's addopts already supplies it, and a second one
      # is -qq, which drops the "N passed" summary from the job log.
      - run: uv run --locked --extra dev pytest
        env:
          UV_PYTHON: ${{ matrix.python }}
      - run: uv run --locked --extra dev ruff check evatt tests
      - run: uv run --locked --extra dev mypy evatt
      - run: uv run --locked --extra dev --python 3.12 python -m build
      # samples/ ships as package data. A wheel that drops it produces a
      # console script whose demo cannot run, so install into a clean venv and
      # drive the commands from an empty directory. The assertions below are
      # the behaviours the README documents, not only the happy path: a
      # byte-exact round trip, a halt that writes nothing, and the refusals
      # that protect the only copy of the key.
      - name: Install the wheel and run the demo from an empty directory
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --no-index --find-links dist evatt
          mkdir /tmp/demo
          cd /tmp/demo
          # Every command asks git whether it would let you commit the map, so
          # the demo directory has to be a work tree with a covering rule.
          git init --quiet .
          printf 'entities.json\n*.triage.md\n' > .gitignore
          SAMPLES=$(/tmp/venv/bin/python -c "import evatt, pathlib; print(pathlib.Path(evatt.__file__).parent / 'samples')")
          cp "$SAMPLES/entities.sample.json" entities.json
          cp "$SAMPLES/entities-only.md" in.md
          cp "$SAMPLES/identifiers.md" identifiers.md
          cp "$SAMPLES/unmapped-name.md" halt.md

          # 1. redact, verify and restore, with the round trip byte for byte.
          /tmp/venv/bin/evatt redact --in in.md --map entities.json --out build/out.md
          /tmp/venv/bin/evatt verify --in build/out.md --map entities.json
          /tmp/venv/bin/evatt restore --in build/out.md --map entities.json --out build/back.md
          cmp in.md build/back.md
          test -f build/out.md.manifest.json
          cat build/out.md.manifest.json

          # 2. A file that uses CRLF throughout comes back with CRLF intact.
          awk '{ printf "%s\r\n", $0 }' in.md > crlf.md
          /tmp/venv/bin/evatt redact --in crlf.md --map entities.json --out build/crlf.md
          /tmp/venv/bin/evatt restore --in build/crlf.md --map entities.json --out build/crlf-back.md
          cmp crlf.md build/crlf-back.md

          # 3. verify exits 2 on a file that is not ready. Its output is
          # redirected rather than echoed, because verify prints the values it
          # found and a tax file number in a job log is the leak this package
          # exists to prevent.
          set +e
          /tmp/venv/bin/evatt verify --in identifiers.md --map entities.json > verify.log 2>&1
          code=$?
          set -e
          test "$code" -eq 2
          grep -q "not ready to send" verify.log

          # 4. A halt exits 2, writes a triage file, and clears any stale
          # output already sitting at that path. The clean redact above it is
          # what puts a stale output there to be cleared.
          /tmp/venv/bin/evatt redact --in in.md --map entities.json --out build/halt.md
          test -f build/halt.md
          set +e
          /tmp/venv/bin/evatt redact --in halt.md --map entities.json --out build/halt.md
          code=$?
          set -e
          test "$code" -eq 2
          test ! -f build/halt.md
          test ! -f build/halt.md.manifest.json
          test -f build/halt.md.triage.md

          # 5. --out refuses to be the map or the input, and refuses through
          # the two paths it derives as well. A map named map.triage.md is
          # covered by the same gitignore rule as a triage file, and --out map
          # derives that exact path.
          before=$(cksum < entities.json)
          cp entities.json map.triage.md
          set +e
          /tmp/venv/bin/evatt redact --in in.md --map entities.json --out entities.json
          map_code=$?
          /tmp/venv/bin/evatt redact --in in.md --map entities.json --out in.md
          in_code=$?
          /tmp/venv/bin/evatt redact --in in.md --map map.triage.md --out map
          derived_code=$?
          set -e
          test "$map_code" -eq 1
          test "$in_code" -eq 1
          test "$derived_code" -eq 1
          test "$before" = "$(cksum < entities.json)"

          # 6. Nothing the demo produced left the map committable.
          git add -A
          test -z "$(git ls-files entities.json)"
