name: review-ready-gate release blocked

on:
  push:
    tags: ['review-ready-gate/v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-blocked:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse publication until the native release policy is configured
        run: |
          echo "::error::review-ready-gate is a Rust binary. Native release publishing is not configured. Do not tag or publish."
          exit 1
