name: Secrets

on:
  workflow_dispatch:
  pull_request:
  schedule:
    # Weekly full-history scan; pull requests and pushes scan only their commits.
    - cron: "37 5 * * 2"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Keyed on the commit for a push: every pushed revision gets its own scan.
  # Keying on the ref would let a rapid second push, or a scheduled run,
  # cancel an earlier scan, and those commits would then go unscanned.
  group: secrets-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans commits, so a shallow checkout would leave every
          # earlier commit unscanned.
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # The release this config was tested with. The action's default,
          # 8.24.3, cannot read the targetRules in .gitleaks.toml.
          GITLEAKS_VERSION: 8.30.1

      - name: Gitleaks over every pull request commit
        # On a pull request the action scans with --no-merges --first-parent,
        # so a commit that reaches the branch through a merge is never read,
        # nor is anything a merge commit itself adds. This scans every commit
        # between the base and the head with the gitleaks the action installed;
        # --diff-merges=remerge shows what a two-parent merge adds beyond its
        # parents. Git shows nothing for a merge of three or more parents, so
        # one of those fails the check, as does a range that holds no commit.
        # The action above reads the pull request's own files, so this step is
        # the gate: it uses the base's .gitleaks.toml, .gitleaksignore and
        # .gitattributes, never the pull request's, and ignores gitleaks:allow
        # comments, so a pull request cannot allowlist or hide what it adds. A
        # new allowlist entry or fingerprint must reach the base first, in its
        # own pull request.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          range="${BASE_SHA:?}..${HEAD_SHA:?}"
          # gitleaks reads the .gitleaksignore in its source folder and in
          # --gitleaks-ignore-path, so it runs in a folder holding only the
          # base's copies, with GIT_DIR pointing its git at this checkout's
          # history and GIT_ATTR_SOURCE at the base's .gitattributes.
          git_dir="$(git rev-parse --absolute-git-dir)"
          base_config="${RUNNER_TEMP:?}/gitleaks-base"
          mkdir "$base_config"
          in_base() {
            # && because -e does not apply on the left of ||.
            (cd "$base_config" && GIT_DIR="$git_dir" GIT_ATTR_SOURCE="$BASE_SHA" "$@")
          }
          # gitleaks exits 0 when its git log fails, so run the same log, in
          # the same place, first.
          in_base git log -p -U0 --diff-merges=remerge "$range" > /dev/null
          if [ -z "$(git rev-list -n 1 "$range")" ]; then
            echo "::error::No commit lies between the base and the head, so nothing would be scanned."
            exit 1
          fi
          octopus="$(git rev-list --min-parents=3 "$range")"
          if [ -n "$octopus" ]; then
            echo "::error::A merge of three or more parents cannot be scanned for what it adds: ${octopus//$'\n'/ }"
            exit 1
          fi
          if ! git show "$BASE_SHA:.gitleaks.toml" > "$base_config/.gitleaks.toml"; then
            echo "::error::The base has no .gitleaks.toml, so there is no reviewed configuration to scan with."
            exit 1
          fi
          # A base without .gitleaksignore leaves every finding in force.
          if git cat-file -e "$BASE_SHA:.gitleaksignore" 2> /dev/null; then
            git show "$BASE_SHA:.gitleaksignore" > "$base_config/.gitleaksignore"
          fi
          status=0
          in_base gitleaks git . --config .gitleaks.toml --gitleaks-ignore-path . \
            --ignore-gitleaks-allow --redact --verbose \
            --log-opts="--diff-merges=remerge $range" || status=$?
          if [ "$status" -ne 0 ]; then
            # Only names the files; their changes still cannot pass the scan.
            changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- .gitleaks.toml .gitleaksignore .gitattributes || true)"
            if [ -n "$changed" ]; then
              echo "::error::This pull request changes ${changed//$'\n'/ and }, which may be why the scan failed: it uses the base's copy, so land that change in its own pull request first."
            fi
            exit "$status"
          fi
