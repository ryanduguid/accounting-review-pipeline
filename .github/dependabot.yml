version: 2
updates:
  # Python dependency updates stay scoped to their component directory so one
  # package never forces another package's lockfile to change.
  - package-ecosystem: "uv"
    directory: "/packages/monthly-close-control-plane"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/packages/xero-trial-balance-export"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/packages/review-ready-gate"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "uv"
    directory: "/packages/elizabeth-anne-alexander"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "uv"
    directory: "/packages/evatt"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # The root uv workspace lock. `uv run --locked` inside every component
  # directory validates this lock, not the component's, so it must move too.
  # The workspace declares no package of its own: its only direct requirements
  # are the shared `dev` group in the root pyproject.toml.
  #
  # Dependabot's uv support reads the member pyproject.toml files as well as
  # the root one, so this entry sees the same direct requirements the five
  # component entries see. Every one of them is a loose floor that Dependabot
  # leaves alone (a component bump changes only that component's uv.lock), and
  # the five exact pins are ignored below, so a root run moves only the root
  # uv.lock. The component entries keep moving the component locks; the two
  # are different files, not duplicates. One group keeps the root refresh to a
  # single pull request a week.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      root-workspace-lock:
        patterns:
          - "*"
    ignore:
      # The five check tools carry the same exact pin in every member's `dev`
      # extra and in the root `dev` group, and one workspace resolution must
      # hold them all. A bump at the root alone cannot resolve against the
      # members' pins, so those five move together in a reviewed change.
      - dependency-name: "ruff"
      - dependency-name: "mypy"
      - dependency-name: "pytest"
      - dependency-name: "pytest-cov"
      - dependency-name: "coverage"

  # Repository-level GitHub Actions updates for the root workflows, the only
  # ones in the repository.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # init and analyze are separate dependencies to Dependabot but must
      # move together: a job running one release against the other's config
      # fails outright. Grouped so the pair can never arrive split.
      codeql-action:
        patterns:
          - "github/codeql-action*"
    ignore:
      # ADR-0001: the release-policy pin is an immutable full commit SHA,
      # advanced only by a reviewed migration that also updates the pin
      # assertion and verifies attestations against the new signer workflow.
      # Dependabot can do neither, so its bumps are refused by the pin tests
      # and sit red forever. Pin drift is tracked by release-policy's canary
      # audit instead.
      - dependency-name: "ryanduguid/release-policy/.github/workflows/*"
