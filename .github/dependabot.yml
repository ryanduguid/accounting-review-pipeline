version: 2
updates:
  # The exporter is the one component outside the uv workspace, so its pip
  # requirements get their own entry. The 4 uv components have none: inside a
  # workspace member uv resolves from the root, so a member-directory update
  # rewrites the root lock, never the member's own uv.lock, and every such
  # job failed (the last on 20 September 2026) without opening a pull request.
  # The member locks move with each release and ci-package.yml checks them
  # from a copy outside the workspace.
  - package-ecosystem: "pip"
    directory: "/packages/xero-trial-balance-export"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"

  # The root uv workspace lock. `uv run --locked` inside every component
  # directory validates this lock, not the component's, so it must move too.
  # The workspace declares no package of its own: its only direct requirements
  # are the shared `dev` group in the root pyproject.toml.
  #
  # Dependabot's uv support reads the member pyproject.toml files as well as
  # the root one, so this entry sees every component's direct requirements.
  # The 5 exact pins are ignored below, so a root run moves only the root
  # uv.lock. One group keeps the root refresh to a single pull request a week.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      root-workspace-lock:
        patterns:
          - "*"
    ignore:
      # The 5 check tools carry the same exact pin in every member's `dev`
      # extra and in the root `dev` group, and one workspace resolution must
      # hold them all. A bump at the root alone cannot resolve against the
      # members' pins, so those 5 move together in a reviewed change.
      - dependency-name: "ruff"
      - dependency-name: "mypy"
      - dependency-name: "pytest"
      - dependency-name: "pytest-cov"
      - dependency-name: "coverage"

  # The Power BI app's pinned PBIR validator, reviewed through this lockfile
  # rather than resolved by npx at run time.
  - package-ecosystem: "npm"
    directory: "/apps/australian-accounting-power-bi"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # Repository-level GitHub Actions updates for the root workflows, the only
  # ones in the repository.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # init and analyze are separate dependencies to Dependabot but must
      # move together: a job running one release against the other's config
      # fails outright. Grouped so the pair can never arrive split.
      codeql-action:
        patterns:
          - "github/codeql-action*"
    ignore:
      # ADR-0001: the release-policy pin is an immutable full commit SHA,
      # advanced only by a reviewed migration that also updates the pin
      # assertion and verifies attestations against the new signer workflow.
      # Dependabot can do neither, so its bumps are refused by the pin tests
      # and sit red forever. Pin drift is tracked by release-policy's canary
      # audit instead.
      - dependency-name: "ryanduguid/release-policy/.github/workflows/*"
