[package]
name = "grant-acquittal-workpapers"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "Local evidence schedules for reviewed grant allocations"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ryanduguid/accounting-review-pipeline"
readme = "README.md"
publish = false

[[bin]]
name = "grant-workpaper"
path = "src/main.rs"

[[example]]
name = "setup_utility"
path = "examples/setup_utility.rs"
test = true

[dependencies]
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The setup example's process trees: a job object per command.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[lints.clippy]
# The repository's 50-line function limit (clippy.toml), denied in CI.
too_many_lines = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
