[package]
name = "australian-accounting-power-bi"
edition = "2024"
rust-version = "1.99"
description = "Fixture generator and structural checks for the Australian Accounting Power BI reference application"
license = "MIT"
repository = "https://github.com/ryanduguid/accounting-review-pipeline"
readme = "README.md"
publish = false

[[bin]]
name = "generate-fixtures"
path = "src/main.rs"

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"

[dev-dependencies]
regex = "1"
serde_json = "1"
sha2 = "0.11"

[lints.clippy]
# The repository's 50-line function limit (clippy.toml), denied in CI.
too_many_lines = "warn"
