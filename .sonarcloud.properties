# SonarQube Cloud automatic analysis settings.

# Test code is analysed with the test rules and kept out of the production
# measures. Sources and tests both start at the root; the same patterns move
# test files from one set to the other, so no file is in both.
sonar.sources=.
sonar.exclusions=**/tests/**,**/test/**,**/__tests__/**,**/test_*.py,**/*_test.py,**/conftest.py,**/*.test.js,**/*.test.mjs,**/*.test.ts,**/*.spec.js,**/*.spec.mjs,**/*.spec.ts
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/test/**,**/__tests__/**,**/test_*.py,**/*_test.py,**/conftest.py,**/*.test.js,**/*.test.mjs,**/*.test.ts,**/*.spec.js,**/*.spec.mjs,**/*.spec.ts

# The analyser supports Python up to 3.14; this code targets Python 3.14 and later.
sonar.python.version=3.14

# Each standalone crate vendors its own copy of the shared support modules:
# the Python-compatibility layers (CPython's json, decimal, pathlib, csv and
# text semantics), the extended dates, the stdio text layer and the generated
# Unicode tables. Leave those copies out of copy-paste detection so duplication
# measures the crates' own code; product code stays in scope.
sonar.cpd.exclusions=**/py*.rs,**/tables.rs,**/gen_unicode_tables.rs,**/decimal.rs,**/isodate.rs,**/oserror.rs,**/termsize.rs,**/argtheme.rs,**/textwrap.rs,**/stdio.rs,adapters/accounting-excel-toolkit/src/aged/json.rs,adapters/accounting-excel-toolkit/src/aged/path.rs,adapters/accounting-excel-toolkit/src/aged/text.rs
