# SonarQube Cloud automatic analysis settings.

# Test code is analysed with the test rules and kept out of the production
# measures. Sources and tests both start at the root; the same patterns move
# test files from one set to the other, so no file is in both.
sonar.sources=.
sonar.exclusions=**/tests/**,**/test/**,**/__tests__/**,**/test_*.py,**/*_test.py,**/conftest.py,**/*.test.js,**/*.test.mjs,**/*.test.ts,**/*.spec.js,**/*.spec.mjs,**/*.spec.ts
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/test/**,**/__tests__/**,**/test_*.py,**/*_test.py,**/conftest.py,**/*.test.js,**/*.test.mjs,**/*.test.ts,**/*.spec.js,**/*.spec.mjs,**/*.spec.ts

# The analyser supports Python up to 3.14; this code targets Python 3.14 and later.
sonar.python.version=3.14

# Copy-paste detection skips 2 kinds of file that repeat across components on
# purpose. They stay in every other measure.
#
# Generated Unicode tables (tables.rs): each native component carries its own
# copy of the same generator output (headed "Generated by ... do not edit").
# They are fixed by regenerating, not by editing.
#
# Ports of Python standard library and runtime behaviour (pyjson through
# stdio, and the Excel toolkit's copies of them): AGENTS.md forbids a shared
# runtime library and any production import of a sibling component, so every
# component that needs one keeps its own copy, and duplication across
# components is expected. This check would not catch drift between the copies
# either way.
sonar.cpd.exclusions=**/src/tables.rs,**/src/pyjson.rs,**/src/pypath.rs,**/src/decimal.rs,**/pycsv.rs,**/src/pytext.rs,**/isodate.rs,**/src/oserror.rs,**/src/termsize.rs,**/src/argtheme.rs,**/src/textwrap.rs,**/src/stdio.rs,adapters/accounting-excel-toolkit/src/aged/json.rs,adapters/accounting-excel-toolkit/src/aged/path.rs,adapters/accounting-excel-toolkit/src/aged/text.rs,adapters/accounting-excel-toolkit/src/transactions/csv.rs
