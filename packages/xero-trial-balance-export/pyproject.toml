[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xero-trial-balance-export"
version = "0.1.8"
description = "Export a Xero trial balance to a tidy CSV for Power BI, pandas or Excel."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.34.2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.urls]
Homepage = "https://github.com/ryanduguid/accounting-review-pipeline/tree/main/packages/xero-trial-balance-export"
Issues = "https://github.com/ryanduguid/accounting-review-pipeline/issues"

[project.optional-dependencies]
dev = [
    "ruff==0.16.6",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "coverage==7.16.0",
    "build>=1.2",
]

[project.scripts]
export-tb = "export_tb:run"
xero-tb-auth = "auth:main"

[tool.setuptools]
py-modules = ["auth", "xero_client", "export_tb", "token_store"]

# The exporter is four flat modules, not a package, so the type-check and
# coverage scopes are the module list. Ruff reads ruff.toml beside this file.
[tool.mypy]
python_version = "3.10"
files = ["xero_client.py", "export_tb.py", "auth.py", "token_store.py"]
ignore_missing_imports = true
pretty = true

[tool.coverage.run]
source = ["xero_client", "export_tb", "auth", "token_store"]
