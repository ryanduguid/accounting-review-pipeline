[package]
name = "xero-trial-balance-export-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
xero-trial-balance-export = { path = "..", features = ["tools"] }

# A separate workspace, so the component's own build never compiles the fuzzer.
[workspace]
members = ["."]

[[bin]]
name = "report_json"
path = "fuzz_targets/report_json.rs"
test = false
doc = false
bench = false
