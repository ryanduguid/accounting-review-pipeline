# Example: scheduled readiness check with GitHub Actions.
#
# Copy this file to .github/workflows/ in your own repository and adjust the
# paths. It runs review-ready against a synthetic pack stored in the repository
# and fails the job when the pack is BLOCKED.
#
# Exit codes, from reviewready/cli.py:
#   0  the pack is READY
#   1  malformed input, invalid command configuration, or unwritable --output
#   2  the pack is not allowed onto the review desk (NOT_READY or BLOCKED)
#
# NOT_READY and BLOCKED share exit code 2, so the exit code alone cannot single
# out BLOCKED. The step below treats exit 1 as job-stopping, then reads
# overall_status from readiness-pack.json to distinguish the two: BLOCKED
# fails the job, NOT_READY is reported and left for a human. READY is green.
# READY still does not mean the file is approved.
#
# This example uses the fabricated NOT_READY pack so the report-and-leave-for-a-
# human path is visible. Point --pack at examples/bas-blocked to see the job
# fail, or examples/bas-ready for a green READY run.
#
# Store only fabricated or synthetic data in the repository. Never commit a
# client workpaper pack.

name: scheduled-readiness-check

on:
  schedule:
    # 06:00 UTC on the first day of each month, after a typical pack drop.
    - cron: "0 6 1 * *"
  # Allow a manual run from the Actions tab while testing the workflow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install review-ready-gate
        run: python -m pip install .
        # After a tagged release, pin the attested wheel SHA instead of
        # installing from the checkout, the same way Monthly Close Controls
        # pins its GitHub Release asset.

      - name: Run the readiness gate
        id: gate
        # The && / || pair captures the exit code without tripping the shell's
        # exit-on-error mode, so this step always succeeds and the status step
        # below decides the job outcome.
        run: |
          review-ready gate \
            --profile bas \
            --pack examples/bas-not-ready \
            --output outputs/readiness-check && code=0 || code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Fail on BLOCKED, report NOT_READY
        run: |
          code="${{ steps.gate.outputs.exit_code }}"
          if [ "$code" = "1" ]; then
            echo "review-ready reported a malformed input or configuration." >&2
            exit 1
          fi
          status=$(python -c "import json; print(json.load(open('outputs/readiness-check/readiness-pack.json'))['overall_status'])")
          echo "Overall status: $status (exit code $code)"
          if [ "$status" = "BLOCKED" ]; then
            echo "The pack failed an integrity gate. Return it to the preparer." >&2
            exit 1
          fi
          # READY ends the job green. NOT_READY also ends green here: findings
          # need a human, and the uploaded pack is the return-to-preparer queue.

      - name: Upload the readiness pack
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readiness-pack
          path: outputs/readiness-check/
