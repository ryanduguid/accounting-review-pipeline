[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "review-ready-gate"
version = "0.1.2"
description = "Stop incomplete workpapers reaching manager review"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Duguid" }]
keywords = ["accounting", "review", "workpapers", "australia", "quality-control"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting",
]
[project.urls]
Homepage = "https://duguid.com.au/tools/workpaper-review-gate/"
Documentation = "https://github.com/ryanduguid/workpaper-review-gate/tree/v0.1.2/evaluation/manager_review_gate"
Repository = "https://github.com/ryanduguid/workpaper-review-gate.git"
Issues = "https://github.com/ryanduguid/workpaper-review-gate/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.11", "mypy>=1.14", "build>=1.2", "pytest>=8",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
review-ready = "reviewready.cli:main"

[tool.setuptools]
packages = ["reviewready"]

[tool.setuptools.package-data]
reviewready = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# uv run pytest does not put the repo root on sys.path the way
# python -m pytest does. Keep helpers importable as tests.support.
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["reviewready", "tests"]

[tool.ruff.lint]
select = ["E9", "F82"]

[tool.mypy]
python_version = "3.10"
packages = ["reviewready"]
ignore_missing_imports = true
pretty = true
