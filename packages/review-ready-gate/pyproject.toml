[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "review-ready-gate"
version = "0.1.6"
description = "Stop incomplete workpapers reaching manager review"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Duguid" }]
keywords = ["accounting", "review", "workpapers", "australia", "quality-control"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting",
]
[project.urls]
Homepage = "https://duguid.com.au/tools/workpaper-review-gate/"
Documentation = "https://github.com/ryanduguid/accounting-review-pipeline/tree/review-ready-gate/v0.1.6/packages/review-ready-gate/evaluation/manager_review_gate"
Repository = "https://github.com/ryanduguid/accounting-review-pipeline.git"
Issues = "https://github.com/ryanduguid/accounting-review-pipeline/issues"

[project.optional-dependencies]
dev = [
    "ruff==0.16.6",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "coverage==7.16.0",
    "build>=1.2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
review-ready = "reviewready.cli:main"

[tool.setuptools]
packages = ["reviewready"]

[tool.setuptools.package-data]
reviewready = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# uv run pytest does not put the repo root on sys.path the way
# python -m pytest does. Keep helpers importable as tests.support.
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["reviewready", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
packages = ["reviewready"]
ignore_missing_imports = true
pretty = true

[tool.coverage.run]
source = ["reviewready"]
