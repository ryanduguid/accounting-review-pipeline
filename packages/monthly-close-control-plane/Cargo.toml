[package]
name = "monthly-close-control-plane"
version = "1.2.0"
edition = "2024"
rust-version = "1.99"
publish = false
autoexamples = false
description = "Offline monthly close controls and verified review evidence"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ryanduguid/accounting-review-pipeline"
homepage = "https://duguid.com.au/tools/monthly-close-controls/"

[dependencies]
num-bigint = "0.5.1"
num-integer = "0.1"
num-traits = "0.2"
sha2 = "0.11"
getrandom = "0.4"
cap-std = "4.0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[features]
probe = []
tools = []

[[bin]]
name = "close-control-fuzz"
path = "tools/fuzz.rs"
required-features = ["tools"]

[[bin]]
name = "close-control-clearing-demo"
path = "examples/clearing_demo.rs"
required-features = ["tools"]

[[bin]]
name = "close-control-equity-demo"
path = "examples/equity_demo.rs"
required-features = ["tools"]

[[bin]]
name = "close-control"
path = "src/main.rs"

[[bin]]
name = "close-control-probe"
path = "src/probe_main.rs"
required-features = ["probe"]

[[bin]]
name = "close-control-differential"
path = "tools/differential.rs"
required-features = ["probe"]

[[example]]
name = "differential-negative-controls"
path = "tests/support/differential_negative_controls.rs"
required-features = ["probe"]

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[lints.clippy]
# The repository's 50-line function limit (clippy.toml), denied in CI.
too_many_lines = "warn"
ref_option = "warn"
