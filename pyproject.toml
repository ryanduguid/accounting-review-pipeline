# Workspace root. This file is a development entrypoint only: it is not a
# distributable package, carries no name or version, and ships nothing to PyPI.
# Each component under packages/ keeps its own pyproject.toml, uv.lock, version,
# release notes and licence, and is still built and released on its own from its
# own directory through its root release caller.
#
# The root exists so a fresh clone can install every Python component and the
# shared test toolchain in one command and run the whole suite from the top. See
# the justfile for the setup, lint, typecheck and test entrypoints.
#
# Only the four Python distributions are members. The Excel adapter and the
# Power BI application have no pyproject.toml and no Python dependencies; the
# justfile runs their standard-library unittest suites from the same .venv.

[tool.uv.workspace]
members = ["packages/*"]

# The shared toolchain for running every component's checks from one
# environment: the union of what the component `dev` extras and test suites
# import, with loose floors. Components keep their own `dev` extras, which
# remain the authority for their own CI. No exact pins: the four members
# declare none, and an exact pin here would only make the root lock disagree
# with a component the day it moves.
[dependency-groups]
dev = [
  "build>=1.2",
  "mypy>=1.14",
  "pytest>=8",
  "PyYAML>=6.0.3,<7",
  "ruff>=0.11",
  'tomli>=2.0; python_version < "3.11"',
]
