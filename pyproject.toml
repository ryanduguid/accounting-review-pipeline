# Development toolchain only; the root has no distribution or runtime package.
[tool.uv.workspace]
members = []

# Shared tools for the remaining Python conformance and application consumers.
[dependency-groups]
dev = [
  "ruff==0.16.10",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "coverage==7.16.2",
  "build>=1.6.1",
  "PyYAML>=6.0.3,<7",
]

[tool.pytest.ini_options]
# Component suites reuse test-module names and import local test helpers.
addopts = "--import-mode=importlib"
pythonpath = [
  ".",
  "apps/grant-acquittal-workpapers",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# Root checks use the core rules; components retain their own rule sets.
select = ["E4", "E7", "E9", "F"]
