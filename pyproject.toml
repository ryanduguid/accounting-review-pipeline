[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "monthly-close-control-plane"
version = "0.1.1"
description = "A review-first monthly close control pack for validated trial-balance exports"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Duguid" }]
keywords = ["accounting", "month-end-close", "reconciliation", "xero", "controls"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting",
]
[project.urls]
Homepage = "https://github.com/ryanduguid/monthly-close-control-plane"
Repository = "https://github.com/ryanduguid/monthly-close-control-plane.git"
Issues = "https://github.com/ryanduguid/monthly-close-control-plane/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.11", "mypy>=1.14","build>=1.2", "pytest>=8", "PyYAML>=6.0.3,<7"]

[project.scripts]
close-control = "closecontrol.cli:main"
openaccountants-au = "closecontrol.pipeline_cli:main"

[tool.setuptools]
packages = ["closecontrol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["closecontrol", "tests"]

[tool.ruff.lint]
# First-enablement set: syntax and undefined-name errors only (E9, F82).
# Keep Decimal("10.00") money literals and existing import layout.
select = ["E9", "F82"]

[tool.mypy]
python_version = "3.10"
packages = ["closecontrol"]
ignore_missing_imports = true
pretty = true

