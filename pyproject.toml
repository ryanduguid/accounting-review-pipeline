# Workspace root. This file is a development entrypoint only: it is not a
# distributable package, carries no name or version, and ships nothing to PyPI.
# Each component under packages/ keeps its own pyproject.toml, uv.lock, version,
# release notes and licence, and is still built and released on its own from its
# own directory through its root release caller.
#
# The root exists so a fresh clone can install every Python component and the
# shared test toolchain in one command and run the whole suite from the top. See
# the justfile for the setup, lint, typecheck and test entrypoints.
#
# Only the 2 Python distributions are members. The Xero Ledger Review Gate,
# evatt and exporter are Rust crates checked with cargo and are excluded. The Excel adapter and the
# Power BI application have no pyproject.toml and no Python dependencies, and
# the grant workpapers application keeps its pyproject.toml for standalone use;
# the justfile runs their standard-library unittest suites from the same .venv.

[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/elizabeth-anne-alexander", "packages/evatt", "packages/xero-trial-balance-export"]

# The shared toolchain for running every component's checks from one
# environment: the union of what the component `dev` extras and test suites
# import. Components keep their own `dev` extras, which remain the authority
# for their own CI. The 5 check tools carry the same exact pin in every
# member's `dev` extra and here, so one workspace resolution holds them all and
# `just lint`, `just typecheck` and `just test` run the versions CI runs. Move
# a pin in the root and both workspace members together.
[dependency-groups]
dev = [
  "ruff==0.16.10",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "coverage==7.16.2",
  "build>=1.6.1",
  "PyYAML>=6.0.3,<7",
]

[tool.pytest.ini_options]
# Component suites reuse test-module names and import local test helpers.
addopts = "--import-mode=importlib"
pythonpath = [
  ".",
  "packages/review-ready-gate",
  "packages/monthly-close-control-plane/tests",
  "apps/grant-acquittal-workpapers",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# Root checks use the core rules; components retain their own rule sets.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.14"
files = [
  "packages/monthly-close-control-plane/closecontrol",
  "packages/review-ready-gate/reviewready",
]
ignore_missing_imports = true
pretty = true
