# The project status enforces full measured coverage across all CI reports, and
# the patch status fails any change that leaves a line it adds or changes
# untested. Both fail when CI fails.
coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0%
        if_not_found: failure
        if_ci_failed: error
    patch:
      default:
        target: 100%
        threshold: 0%
        if_ci_failed: error
comment: false
# Keep carryforward available for flagged uploads.
flag_management:
  default_rules:
    carryforward: true
