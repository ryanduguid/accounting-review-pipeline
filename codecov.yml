# The project status enforces full measured coverage across all CI reports.
coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0%
        if_not_found: failure
    patch:
      default:
        informational: true
comment: false
# Keep carryforward available for flagged uploads.
flag_management:
  default_rules:
    carryforward: true
